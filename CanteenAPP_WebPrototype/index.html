<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7a1f2b">
<title>Campus Vendor Marketplace – Prototype</title>
<style>
:root{--maroon:#7a1f2b;--gold:#f2b705;--bg:#f2f3f5;--card:#fff;--ink:#1d1d22;--mute:#6b6b76;--line:#dcdde2;--ok:#1f7a45;--no:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:90px}
header{background:var(--maroon);color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px;font-weight:700}
.net{float:right;font-size:12px;padding:2px 8px;border-radius:99px;background:#ffffff26}
.net.off{background:var(--gold);color:#3a2a00;font-weight:600}
.tabs{display:flex;gap:4px;margin-top:10px}
.tabs button{flex:1;border:0;background:transparent;color:#ffffffb3;padding:10px;font:inherit;font-weight:600;border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:#fff;border-color:var(--gold)}
main{padding:14px}
h2{font-size:18px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mute{color:var(--mute);font-size:14px}
.tag{display:inline-block;font-size:12px;background:#f6e9eb;color:var(--maroon);border-radius:6px;padding:1px 7px;margin-right:4px}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px 0 12px;padding-bottom:2px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}
button.btn{background:var(--maroon);color:#fff;border:0;border-radius:8px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;width:100%}
button.btn.alt{background:#fff;color:var(--maroon);border:1px solid var(--maroon)}
button.link{background:none;border:0;color:var(--maroon);font:inherit;font-weight:600;padding:4px 0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--maroon);background:#fff;color:var(--maroon);font-size:18px;cursor:pointer}
.soldout{opacity:.5}
.cartbar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;padding:12px 14px;background:#fff;border-top:1px solid var(--line)}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.sw span{position:absolute;inset:0;background:#c3c4cb;border-radius:99px;transition:.15s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span::after{left:23px}
.sw input:focus-visible+span{outline:3px solid var(--gold)}
.pay{display:flex;gap:8px;margin:8px 0}
.pay label{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;cursor:pointer;background:#fff}
.pay input{display:none}
.pay label:has(input:checked){border-color:var(--maroon);background:#f6e9eb;font-weight:600}
.qr{width:150px;height:150px;margin:8px auto;border:2px dashed var(--line);display:grid;place-items:center;color:var(--mute);font-size:13px;text-align:center;border-radius:8px}
.slip{background:#fff;border:1px solid var(--line);border-radius:4px;padding:18px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;position:relative}
.slip::before,.slip::after{content:"";position:absolute;left:0;right:0;height:8px;background:radial-gradient(circle at 6px 0,var(--bg) 5px,transparent 5.5px) 0 0/12px 8px repeat-x}
.slip::before{top:-8px;transform:scaleY(-1)}
.slip::after{bottom:-8px}
.slip hr{border:0;border-top:1px dashed #999;margin:10px 0}
.code{font-size:38px;font-weight:700;text-align:center;letter-spacing:2px;color:var(--maroon)}
.slip .r{display:flex;justify-content:space-between;gap:8px}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.done{color:var(--ok);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="net" id="net">online</span>
    <h1>Campus Vendor Marketplace</h1>
    <div class="tabs" id="tabs"></div>
  </header>
  <main id="main"></main>
  <div id="bar"></div>
</div>

<script>
const KEY = 'cvm-proto-v1';
const SLOT_CAP = 5;          // max orders per pickup slot
const SLOT_MIN = 15;         // slot length in minutes

/* ---------- data ---------- */
function seed() {
  const now = Date.now();
  return {
    counter: { v1: 141, v2: 87, v3: 20 },
    orders: [],
    vendors: [
      { id:'v1', prefix:'A', name:'Ate Linda’s Silog', stall:'Stall 3, Canteen', category:'Meals', open:420, close:1020, gcash:'0917 123 4567', updated:now,
        items:[{id:'i1',name:'Menudo',price:60,available:true},{id:'i2',name:'Tapsilog',price:70,available:true},{id:'i3',name:'Tocilog',price:65,available:true},{id:'i4',name:'Extra rice',price:15,available:true}] },
      { id:'v2', prefix:'B', name:'Kuya Ben’s Drinks', stall:'Stall 8, Lagoon side', category:'Drinks', open:480, close:1020, gcash:'0918 765 4321', updated:now,
        items:[{id:'i1',name:'Iced tea',price:25,available:true},{id:'i2',name:'Buko juice',price:30,available:true},{id:'i3',name:'Iced coffee',price:35,available:true}] },
      { id:'v3', prefix:'C', name:'Mang Tonyo’s Merienda', stall:'Stall 12, Canteen', category:'Snacks', open:540, close:960, gcash:'0920 111 2233', updated:now,
        items:[{id:'i1',name:'Siomai (5 pcs)',price:35,available:true},{id:'i2',name:'Banana cue',price:15,available:true},{id:'i3',name:'Fishball',price:20,available:true}] }
    ]
  };
}
function load() { try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch (e) {} return seed(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
let db = load();

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const peso = n => '₱' + n;
const vend = id => db.vendors.find(v => v.id === id);
function t12(m) { const h = Math.floor(m / 60), mm = String(m % 60).padStart(2, '0'); return ((h + 11) % 12 + 1) + ':' + mm + ' ' + (h >= 12 ? 'PM' : 'AM'); }
function ago(ts) { const m = Math.round((Date.now() - ts) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : Math.round(m / 60) + ' hr ago'; }
function nowMin() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function slotCount(vid, slot) { return db.orders.filter(o => o.vid === vid && o.slot === slot && !o.done).length; }

/* ---------- state ---------- */
let ui = { role:'student', screen:'list', vid:null, cart:{}, q:'', cat:'All', pay:'gcash', slot:null, slip:null, myVendor:'v1' };
const total = () => Object.entries(ui.cart).reduce((s, [id, q]) => s + q * vend(ui.vid).items.find(i => i.id === id).price, 0);
const count = () => Object.values(ui.cart).reduce((s, q) => s + q, 0);
function go(screen, extra) { Object.assign(ui, { screen }, extra || {}); render(); window.scrollTo(0, 0); }

/* ---------- views ---------- */
function tabs() {
  const t = [['student', 'Student'], ['vendor', 'Vendor']];
  $('#tabs').innerHTML = t.map(([r, l]) => `<button class="${ui.role === r ? 'on' : ''}" data-role="${r}">${l}</button>`).join('');
}

function viewList() {
  const cats = ['All', ...new Set(db.vendors.map(v => v.category))];
  const list = db.vendors.filter(v => (ui.cat === 'All' || v.category === ui.cat) &&
    (v.name + ' ' + v.items.map(i => i.name).join(' ')).toLowerCase().includes(ui.q.toLowerCase()));
  return `<h2>Find a vendor</h2>
  <input id="q" type="search" placeholder="Search vendor or food (e.g. menudo)" value="${ui.q}">
  <div class="chips">${cats.map(c => `<button class="chip ${ui.cat === c ? 'on' : ''}" data-cat="${c}">${c}</button>`).join('')}</div>
  ${list.map(v => `<div class="card"><div class="row"><div>
      <strong>${v.name}</strong><br><span class="mute">${v.stall} · ${t12(v.open)}–${t12(v.close)}</span><br>
      <span class="tag">${v.category}</span><span class="mute">${v.items.filter(i => i.available).length} items available</span>
    </div><button class="link" data-vendor="${v.id}">View menu</button></div></div>`).join('') || '<div class="empty">No vendors match your search.</div>'}
  <button class="btn alt" data-go="orders">My order slips (${db.orders.filter(o => o.mine).length})</button>`;
}

function viewMenu() {
  const v = vend(ui.vid);
  return `<button class="link" data-go="list">‹ All vendors</button>
  <h2>${v.name}</h2>
  <p class="mute">${v.stall} · Menu updated ${ago(v.updated)}</p>
  ${v.items.map(i => `<div class="card row ${i.available ? '' : 'soldout'}">
    <div><strong>${i.name}</strong><br><span class="mute">${peso(i.price)}${i.available ? '' : ' · Sold out'}</span></div>
    ${i.available ? `<div class="qty"><button data-dec="${i.id}" aria-label="Remove one ${i.name}">−</button><span>${ui.cart[i.id] || 0}</span><button data-inc="${i.id}" aria-label="Add one ${i.name}">+</button></div>` : ''}
  </div>`).join('')}`;
}

function viewCheckout() {
  const v = vend(ui.vid), now = nowMin();
  const slots = [];
  for (let m = v.open; m < v.close; m += SLOT_MIN) { if (m + SLOT_MIN > now) slots.push(m); }
  if (ui.slot == null || !slots.includes(ui.slot)) ui.slot = (slots.find(m => slotCount(v.id, m) < SLOT_CAP)) ?? null;
  const lines = Object.entries(ui.cart).map(([id, q]) => { const i = v.items.find(x => x.id === id); return `<div class="row"><span>${q} × ${i.name}</span><span>${peso(q * i.price)}</span></div>`; }).join('');
  return `<button class="link" data-go="menu">‹ Back to menu</button>
  <h2>Checkout</h2>
  <div class="card">${lines}<hr style="border:0;border-top:1px solid var(--line)"><div class="row"><strong>Total</strong><strong>${peso(total())}</strong></div></div>
  <div class="card"><strong>Pickup time</strong>
    <select id="slot">${slots.map(m => { const c = slotCount(v.id, m), full = c >= SLOT_CAP; return `<option value="${m}" ${full ? 'disabled' : ''} ${ui.slot === m ? 'selected' : ''}>${t12(m)} (${full ? 'full' : c + '/' + SLOT_CAP + ' taken'})</option>`; }).join('')}</select>
    <p class="mute" style="margin:6px 0 0">Each slot has a limit so the queue doesn’t just move to one time.</p></div>
  <div class="card"><strong>Payment</strong>
    <div class="pay"><label><input type="radio" name="pay" value="gcash" ${ui.pay === 'gcash' ? 'checked' : ''}>GCash / bank</label><label><input type="radio" name="pay" value="cash" ${ui.pay === 'cash' ? 'checked' : ''}>Cash on pickup</label></div>
    ${ui.pay === 'gcash' ? `<div class="qr">Vendor QR<br>(save to phone)</div><p style="text-align:center;margin:0">Number: <strong>${v.gcash}</strong></p><p class="mute" style="text-align:center;margin:4px 0 0">Pay ${peso(total())}, then show your receipt at the stall.</p>` : `<p class="mute" style="margin:0">Pay ${peso(total())} in cash when you pick up.</p>`}
  </div>
  <button class="btn" data-make ${ui.slot == null ? 'disabled' : ''}>Make order slip</button>`;
}

function slipHTML(o) {
  return `<div class="slip">
    <div style="text-align:center">${o.vname}</div><div class="code">${o.code}</div><div style="text-align:center">PICKUP ${t12(o.slot)}</div><hr>
    ${o.items.map(i => `<div class="r"><span>${i.qty} × ${i.name}</span><span>${peso(i.qty * i.price)}</span></div>`).join('')}<hr>
    <div class="r"><strong>TOTAL</strong><strong>${peso(o.total)}</strong></div>
    <div class="r"><span>Payment</span><span>${o.pay === 'gcash' ? 'GCash / bank' : 'Cash'}</span></div><hr>
    <div class="mute" style="font-size:12px">${new Date(o.ts).toLocaleString()}</div>
    <div style="font-size:12px;margin-top:6px">${o.pay === 'gcash' ? 'Show this slip + your payment receipt at the stall.' : 'Show this slip at the stall and pay in cash.'}</div>
    ${o.done ? '<div class="done" style="margin-top:6px">Marked done by vendor</div>' : ''}
  </div>`;
}

function viewSlip() { return `<h2>Your order slip</h2><p class="mute">Saved on this phone. It works without internet.</p>${slipHTML(ui.slip)}<br><button class="btn" data-go="list">Back to vendors</button>`; }
function viewOrders() {
  const mine = db.orders.filter(o => o.mine).reverse();
  return `<button class="link" data-go="list">‹ All vendors</button><h2>My order slips</h2>
  ${mine.map(o => `<div class="card row"><div><strong>${o.code}</strong> · ${o.vname}<br><span class="mute">${peso(o.total)} · pickup ${t12(o.slot)}</span></div><button class="link" data-slip="${o.code}">Open</button></div>`).join('') || '<div class="empty">No slips yet.</div>'}`;
}

function viewVendor() {
  const v = vend(ui.myVendor);
  const incoming = db.orders.filter(o => o.vid === v.id && !o.done).sort((a, b) => a.slot - b.slot);
  return `<h2>Vendor dashboard</h2>
  <select id="vsel">${db.vendors.map(x => `<option value="${x.id}" ${x.id === v.id ? 'selected' : ''}>${x.name}</option>`).join('')}</select>
  <h2 style="margin-top:16px">Today’s menu</h2>
  <p class="mute">One tap per item. No stock counts. Updated ${ago(v.updated)}.</p>
  ${v.items.map(i => `<div class="card row"><div><strong>${i.name}</strong><br><span class="mute">${peso(i.price)}</span></div>
    <label class="sw"><input type="checkbox" data-avail="${i.id}" ${i.available ? 'checked' : ''} aria-label="${i.name} available"><span></span></label></div>`).join('')}
  <h2 style="margin-top:16px">Incoming orders (${incoming.length})</h2>
  ${incoming.map(o => `<div class="card"><div class="row"><strong>${o.code} · ${t12(o.slot)}</strong><span class="mute">${peso(o.total)} · ${o.pay === 'gcash' ? 'GCash' : 'Cash'}</span></div>
    <div class="mute">${o.items.map(i => i.qty + ' × ' + i.name).join(', ')}</div><button class="link" data-done="${o.code}">Mark done</button></div>`).join('') || '<div class="empty">No orders yet. Make one from the Student tab.</div>'}
  <button class="link" data-reset>Reset demo data</button>`;
}

function bar() {
  $('#bar').innerHTML = (ui.role === 'student' && ui.screen === 'menu' && count() > 0)
    ? `<div class="cartbar"><button class="btn" data-go="checkout">Checkout · ${count()} item${count() > 1 ? 's' : ''} · ${peso(total())}</button></div>` : '';
}

function render() {
  tabs();
  const views = { list: viewList, menu: viewMenu, checkout: viewCheckout, slip: viewSlip, orders: viewOrders };
  $('#main').innerHTML = ui.role === 'vendor' ? viewVendor() : views[ui.screen]();
  bar();
  const q = $('#q'); if (q && document.activeElement !== q && ui._focusQ) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const d = e.target.closest('[data-role],[data-cat],[data-vendor],[data-go],[data-inc],[data-dec],[data-make],[data-slip],[data-done],[data-reset]');
  if (!d) return;
  const ds = d.dataset;
  if (ds.role) { ui.role = ds.role; if (ds.role === 'student') ui.screen = 'list'; return render(); }
  if (ds.cat) { ui.cat = ds.cat; ui._focusQ = false; return render(); }
  if (ds.vendor) { ui.cart = {}; return go('menu', { vid: ds.vendor }); }
  if (ds.go) return go(ds.go);
  if (ds.inc) { ui.cart[ds.inc] = (ui.cart[ds.inc] || 0) + 1; return render(); }
  if (ds.dec) { const n = (ui.cart[ds.dec] || 0) - 1; if (n > 0) ui.cart[ds.dec] = n; else delete ui.cart[ds.dec]; return render(); }
  if (ds.make !== undefined) {
    const v = vend(ui.vid);
    db.counter[v.id] = (db.counter[v.id] || 0) + 1;
    const o = { code: v.prefix + '-' + db.counter[v.id], vid: v.id, vname: v.name, slot: ui.slot, pay: ui.pay, total: total(), ts: Date.now(), done: false, mine: true,
      items: Object.entries(ui.cart).map(([id, q]) => { const i = v.items.find(x => x.id === id); return { name: i.name, price: i.price, qty: q }; }) };
    db.orders.push(o); save(); ui.cart = {}; ui.slip = o; return go('slip');
  }
  if (ds.slip) { ui.slip = db.orders.find(o => o.code === ds.slip); return go('slip'); }
  if (ds.done) { db.orders.find(o => o.code === ds.done).done = true; save(); return render(); }
  if (ds.reset !== undefined) { db = seed(); save(); ui.cart = {}; return render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { ui.q = e.target.value; ui._focusQ = true; render(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.name === 'pay') { ui.pay = t.value; render(); }
  else if (t.id === 'slot') { ui.slot = Number(t.value); }
  else if (t.id === 'vsel') { ui.myVendor = t.value; render(); }
  else if (t.dataset.avail) { const v = vend(ui.myVendor); v.items.find(i => i.id === t.dataset.avail).available = t.checked; v.updated = Date.now(); save(); render(); }
});

/* ---------- online/offline badge + service worker ---------- */
function net() { const n = $('#net'); n.textContent = navigator.onLine ? 'online' : 'offline mode'; n.className = 'net' + (navigator.onLine ? '' : ' off'); }
addEventListener('online', net); addEventListener('offline', net);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
net(); render();
</script>
</body>
</html>
